<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soul Split</title>
  </head>
  <body>
    <div id="app">
      <div id="game-root"></div>
      <div id="hud">
        <!-- Боевой хром скрыт до setShellMode("battle"): иначе FOUC при обновлении вкладки -->
        <header class="hud-top" hidden>
          <button type="button" id="btn-menu" class="menu-btn" aria-label="Меню" aria-expanded="false" aria-controls="side-menu" hidden>
            <span></span><span></span><span></span>
          </button>
          <div class="controls" hidden>
            <button type="button" id="btn-flee" class="ctrl-btn" aria-label="Белый флаг - сбежать без лута">⚐</button>
            <button type="button" id="btn-pause" class="ctrl-btn" aria-label="Пробел - пауза">❚❚</button>
            <button type="button" id="btn-speed" class="ctrl-btn" aria-label="Скорость">×1</button>
          </div>
        </header>

        <nav id="side-menu" class="side-menu" hidden>
          <button type="button" id="btn-character" class="menu-item" aria-keyshortcuts="C">Персонаж</button>
          <button type="button" id="btn-item-generator" class="menu-item" aria-keyshortcuts="G">Кодекс</button>
        </nav>

        <footer class="hud-bottom">
          <div class="hud-combat-bar" id="hud-combat-bar" hidden>
            <div class="potion-bar" id="potion-bar" aria-label="Зелья">
              <button type="button" class="potion-btn" id="potion-hp" data-potion="healing_potion" aria-label="Зелье здоровья, F" disabled>
                <img class="potion-icon" alt="" draggable="false" />
                <span class="potion-hotkey" aria-hidden="true">F</span>
                <span class="potion-count">0</span>
              </button>
              <button type="button" class="potion-btn" id="potion-mana" data-potion="mana_potion" aria-label="Зелье маны, G" disabled>
                <img class="potion-icon" alt="" draggable="false" />
                <span class="potion-hotkey" aria-hidden="true">G</span>
                <span class="potion-count">0</span>
              </button>
            </div>
            <div class="skill-bar" id="skill-bar"></div>
          </div>
        </footer>

        <div id="battle-banner" class="battle-banner" aria-live="polite" hidden>
          <button type="button" id="btn-start" class="battle-start-btn" hidden>Старт</button>
          <div id="battle-pause-label" class="battle-pause-label" hidden>Пауза</div>
        </div>

        <div class="toast" id="toast" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
